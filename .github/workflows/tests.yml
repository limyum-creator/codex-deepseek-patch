name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
        python-version: ['3.11', '3.13']
        edition: [unified]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate source tree
        shell: python
        run: |
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write('ADAPTER_SOURCE_ROOT=' + ('src' if Path('src/edition.json').is_file() else '.') + '\n')
      - name: Select candidate edition
        shell: python
        env:
          CODEX_TEST_EDITION: ${{ matrix.edition }}
        run: |
          import json, os
          from pathlib import Path
          path = Path(os.environ['ADAPTER_SOURCE_ROOT']) / 'edition.json'
          value = json.loads(path.read_text())
          value['edition'] = os.environ['CODEX_TEST_EDITION']
          value['branch'] = {'ds': 'main', 'proxy': 'codex/existing-proxy-models', 'unified':'main'}[value['edition']]
          path.write_text(json.dumps(value) + '\n')
      - run: python -m unittest discover -s tests -v
        working-directory: ${{ env.ADAPTER_SOURCE_ROOT }}
      - name: Windows background updater preflight
        working-directory: ${{ env.ADAPTER_SOURCE_ROOT }}
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Pythonw = Join-Path (Split-Path (Get-Command python).Source) 'pythonw.exe'
          $Process = Start-Process -FilePath $Pythonw -ArgumentList @('-m', 'unittest', 'discover', '-s', 'tests', '-q') -Wait -PassThru -RedirectStandardError 'windowless-test.log' -RedirectStandardOutput 'windowless-output.log'
          Get-Content 'windowless-test.log'
          if ($Process.ExitCode -ne 0) { exit $Process.ExitCode }
      - run: node tests/route.test.cjs
        working-directory: ${{ env.ADAPTER_SOURCE_ROOT }}
      - run: python -m compileall -q .
        working-directory: ${{ env.ADAPTER_SOURCE_ROOT }}
      - run: python scripts/check_release.py
        working-directory: ${{ env.ADAPTER_SOURCE_ROOT }}
  macos-signing:
    # Apple Silicon is covered by mandatory on-device release receipts.
    # Keep an additional Intel check without the arm64 hosted-runner queue.
    runs-on: macos-15-intel
    strategy:
      matrix:
        edition: [unified]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate source tree
        shell: python
        run: |
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write('ADAPTER_SOURCE_ROOT=' + ('src' if Path('src/edition.json').is_file() else '.') + '\n')
      - name: Select candidate edition
        shell: python
        env:
          CODEX_TEST_EDITION: ${{ matrix.edition }}
        run: |
          import json, os
          from pathlib import Path
          path = Path(os.environ['ADAPTER_SOURCE_ROOT']) / 'edition.json'
          value = json.loads(path.read_text())
          value['edition'] = os.environ['CODEX_TEST_EDITION']
          value['branch'] = {'ds': 'main', 'proxy': 'codex/existing-proxy-models', 'unified':'main'}[value['edition']]
          path.write_text(json.dumps(value) + '\n')
      - run: python -m unittest discover -s tests -v
        working-directory: ${{ env.ADAPTER_SOURCE_ROOT }}
      - run: python scripts/test_macos_signing.py
        working-directory: ${{ env.ADAPTER_SOURCE_ROOT }}
      - run: python scripts/check_release.py
        working-directory: ${{ env.ADAPTER_SOURCE_ROOT }}
